<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Habit Heatmap</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#0F172A;--card:#1E293B;--bd:#334155;--tx:#E2E8F0;--mu:#94A3B8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;margin:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:.75rem;box-shadow:0 8px 24px -12px rgba(0,0,0,.6)}
.btn{border:1px solid var(--bd);border-radius:.5rem;padding:.3rem .6rem;color:var(--mu);transition:.15s}
.btn:hover{color:var(--tx);border-color:#64748B}
.day{aspect-ratio:1/0.82;border-radius:.5rem;border:1px solid var(--bd);background:var(--bg);font-size:.8rem;font-weight:500;color:var(--mu);transition:transform .12s,border-color .12s}
.day:hover{transform:translateY(-1px);border-color:#64748B}
.day.today{outline:2px solid #3B82F6;outline-offset:1px}
.day.on{color:#fff;border-color:transparent;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.day.pop,.hc.pop{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.hc{border-radius:3px;background:var(--bg);border:1px solid var(--bd);aspect-ratio:1;min-width:10px}
:focus-visible{outline:2px solid #3B82F6;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app" class="mx-auto max-w-[1280px] p-3 sm:p-5"></div>
<script>
const COLORS=['#10B981','#3B82F6','#F59E0B','#A78BFA','#F472B6'];
const WD=['T2','T3','T4','T5','T6','T7','CN'];
const LV=['','Nhẹ','Vừa','Trọn vẹn'];
const pad=n=>String(n).padStart(2,'0');
const K=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dow=d=>(d.getDay()+6)%7;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mix=(c,l)=>l?`background:color-mix(in srgb,${c} ${[0,35,65,100][l]}%,transparent)`:'';
const ico={
 l:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg>',
 r:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg>',
 fire:'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 4-2 5-2 8 0 1.5 1 2.500 2 2.500s1.500-1 1.500-2c2 1.500 4 4 4 7a5.500 5.500 0 0 1-11 0c0-3 1.500-5 3-7 1-1.500 2-3.500 2.500-8.500z"/></svg>',
 pie:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round"><path d="M21 12A9 9 0 1 1 12 3v9z"/></svg>',
 cal:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
 trophy:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>',
 x:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>'
};
let S=null;
try{S=JSON.parse(localStorage.getItem('habit-heatmap-v1'))}catch(e){}
if(!S||!S.tasks||!S.tasks.length)S={tasks:[{id:'t1',name:'Đọc sách 30 phút',color:COLORS[0]}],logs:{},sel:'t1',lv:3};
const save=()=>{try{localStorage.setItem('habit-heatmap-v1',JSON.stringify(S))}catch(e){}};
const now=new Date();now.setHours(0,0,0,0);
let vm=new Date(now.getFullYear(),now.getMonth(),1),vy=now.getFullYear(),last='',arm='',chart=null;

function render(){
 const t=S.tasks.find(x=>x.id===S.sel)||S.tasks[0];S.sel=t.id;
 const L=S.logs[t.id]=S.logs[t.id]||{};
 const keys=Object.keys(L).filter(k=>L[k]).sort();
 // streaks
 let best=0,run=0,prev=null;
 keys.forEach(k=>{const d=new Date(k+'T00:00:00');run=(prev&&Math.round((d-prev)/864e5)===1)?run+1:1;best=Math.max(best,run);prev=d});
 let cur=0,c=new Date(now);if(!L[K(c)])c.setDate(c.getDate()-1);
 while(L[K(c)]){cur++;c.setDate(c.getDate()-1)}
 // month
 const mp=vm.getFullYear()+'-'+pad(vm.getMonth()+1),dim=new Date(vm.getFullYear(),vm.getMonth()+1,0).getDate();
 const mDone=keys.filter(k=>k.startsWith(mp)).length;
 const isCur=vm.getTime()===new Date(now.getFullYear(),now.getMonth(),1).getTime();
 const den=isCur?now.getDate():(vm>now?0:dim);
 const mRate=den?Math.round(mDone/den*100):0;
 // week
 const mon=new Date(now);mon.setDate(now.getDate()-dow(now));
 const wk=[...Array(7)].map((_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return {d,l:L[K(d)]||0}});
 const wDone=wk.filter(x=>x.l).length;
 // weekday frequency (viewed year)
 const freq=[0,0,0,0,0,0,0];
 keys.filter(k=>k.startsWith(vy+'-')).forEach(k=>freq[dow(new Date(k+'T00:00:00'))]++);
 // calendar cells
 const first=new Date(vm),off=dow(first);
 let cal=WD.map(w=>`<div class="text-center text-xs text-[#94A3B8] pb-1">${w}</div>`).join('')+'<div></div>'.repeat(off);
 for(let i=1;i<=dim;i++){
  const d=new Date(vm.getFullYear(),vm.getMonth(),i),k=K(d),l=L[k]||0;
  cal+=`<button data-a="day" data-d="${k}" title="${k}${l?' · '+LV[l]:''}" aria-pressed="${!!l}" class="day ${l?'on':''} ${k===K(now)?'today':''} ${k===last?'pop':''}" style="${mix(t.color,l)}">${i}</button>`;
 }
 // year heatmap
 const y0=new Date(vy,0,1),yo=dow(y0),yd=(new Date(vy,11,31)-y0)/864e5+1,weeks=Math.ceil((yo+yd)/7);
 let hm='',lab='',lastM=-1;
 for(let i=0;i<yo;i++)hm+='<div></div>';
 for(let i=0;i<yd;i++){
  const d=new Date(vy,0,1+i),k=K(d),l=L[k]||0;
  hm+=`<div class="hc ${k===last?'pop':''}" title="${k}${l?' · '+LV[l]:''}" style="${mix(t.color,l)};${l?'border-color:transparent':''}"></div>`;
 }
 for(let w=0;w<weeks;w++){
  const d=new Date(vy,0,1+w*7-yo+(w?0:yo));
  const m=d.getMonth();let txt='';
  if(d.getFullYear()===vy&&m!==lastM&&d.getDate()<=7){txt='Th'+(m+1);lastM=m}
  lab+=`<div class="text-[10px] text-[#94A3B8] whitespace-nowrap overflow-visible">${txt}</div>`;
 }
 const yTotal=keys.filter(k=>k.startsWith(vy+'-')).length;
 const kpi=(ic,col,v,s,sub)=>`<div class="card p-4 flex items-center gap-3"><div class="grid place-items-center w-10 h-10 rounded-lg" style="background:${col}22;color:${col}">${ic}</div><div><div class="text-2xl font-bold leading-none tabular-nums">${v}<span class="text-sm font-medium text-[#94A3B8] ml-1">${s}</span></div><div class="text-xs text-[#94A3B8] mt-1">${sub}</div></div></div>`;

 document.getElementById('app').innerHTML=`
 <header class="flex items-center justify-between gap-3 mb-4">
  <div><h1 class="text-xl sm:text-2xl font-bold tracking-tight">Habit Heatmap</h1><p class="text-sm text-[#94A3B8]">Bấm vào ngày để đánh dấu hoàn thành, bấm lại để bỏ đánh dấu.</p></div>
  <button data-a="today" class="btn text-sm">Về hôm nay</button>
 </header>
 <div class="grid gap-4 lg:grid-cols-[270px_1fr]">
  <aside class="card p-4 h-fit space-y-4">
   <div><div class="text-sm font-semibold mb-2">Công việc</div>
    <div class="space-y-1.5">${S.tasks.map(x=>`<div class="flex items-center gap-1"><button data-a="task" data-id="${x.id}" class="flex-1 text-left flex items-center gap-2 px-3 py-2 rounded-lg border text-sm ${x.id===t.id?'bg-[#0F172A] border-[#475569]':'border-transparent hover:bg-[#0F172A]/60'}"><span class="w-2.5 h-2.5 rounded-full shrink-0" style="background:${x.color}"></span><span class="truncate">${esc(x.name)}</span></button>${S.tasks.length>1?`<button data-a="del" data-id="${x.id}" aria-label="Xóa ${esc(x.name)}" class="btn !px-1.5 !py-1.5 ${arm===x.id?'!text-red-400 !border-red-400':''}" title="${arm===x.id?'Bấm lần nữa để xóa':'Xóa công việc'}">${ico.x}</button>`:''}</div>`).join('')}</div>
    <div class="flex gap-2 mt-2"><input id="nt" maxlength="40" placeholder="Thêm công việc mới" class="min-w-0 flex-1 bg-[#0F172A] border border-[#334155] rounded-lg px-3 py-2 text-sm placeholder:text-[#64748B]"><button data-a="add" class="px-3 rounded-lg text-sm font-semibold text-[#0F172A] bg-[#10B981] hover:brightness-110">Thêm</button></div>
   </div>
   <div><div class="text-sm font-semibold mb-2">Mức độ khi đánh dấu</div>
    <div class="grid grid-cols-3 gap-1.5">${[1,2,3].map(n=>`<button data-a="lv" data-n="${n}" aria-pressed="${S.lv===n}" class="rounded-lg border px-2 py-2 text-xs ${S.lv===n?'border-transparent text-white font-semibold':'border-[#334155] text-[#94A3B8] hover:text-white'}" style="${S.lv===n?mix(t.color,n):''}">${LV[n]}</button>`).join('')}</div>
    <p class="text-xs text-[#94A3B8] mt-2">Ô lịch đậm dần theo mức độ. Bấm vào ngày đã có mức khác sẽ đổi sang mức đang chọn.</p>
   </div>
   <button data-a="seed" class="btn w-full text-xs">Tạo dữ liệu mẫu cho công việc này</button>
  </aside>
  <main class="space-y-4 min-w-0">
   <section class="grid grid-cols-2 xl:grid-cols-4 gap-3">
    ${kpi(ico.fire,'#F59E0B',cur,'ngày','Chuỗi hiện tại')}
    ${kpi(ico.trophy,'#3B82F6',best,'ngày','Chuỗi kỷ lục')}
    ${kpi(ico.pie,'#10B981',mRate+'%','','Tỉ lệ hoàn thành tháng')}
    ${kpi(ico.cal,'#A78BFA',keys.length,'ngày','Tổng ngày hoàn thành')}
   </section>
   <section class="grid gap-4 xl:grid-cols-[minmax(0,1.1fr)_minmax(0,1fr)]">
    <div class="card p-4">
     <div class="flex items-center justify-between mb-3"><h2 class="font-semibold">Tháng ${vm.getMonth()+1}, ${vm.getFullYear()}</h2>
      <div class="flex gap-1.5"><button data-a="prev" class="btn" aria-label="Tháng trước">${ico.l}</button><button data-a="next" class="btn" aria-label="Tháng sau">${ico.r}</button></div></div>
     <div class="grid grid-cols-7 gap-1.5">${cal}</div>
     <div class="mt-3 text-xs text-[#94A3B8]">Tháng này: <b class="text-white">${mDone}</b>/${dim} ngày hoàn thành</div>
    </div>
    <div class="space-y-4">
     <div class="card p-4">
      <div class="flex items-end justify-between"><h2 class="font-semibold">Tuần này</h2><div class="text-sm text-[#94A3B8]"><b class="text-xl text-white tabular-nums">${wDone}</b>/7 ngày · <b style="color:${t.color}">${Math.round(wDone/7*100)}%</b></div></div>
      <div class="h-2 rounded-full bg-[#0F172A] mt-3 overflow-hidden"><div class="h-full rounded-full transition-all duration-500" style="width:${wDone/7*100}%;background:${t.color}"></div></div>
      <div class="grid grid-cols-7 gap-1.5 mt-3">${wk.map((x,i)=>`<div class="text-center"><div class="text-[10px] text-[#94A3B8] mb-1">${WD[i]}</div><div class="h-7 rounded-md border border-[#334155] ${K(x.d)===K(now)?'ring-2 ring-[#3B82F6]':''}" style="${mix(t.color,x.l)}"></div></div>`).join('')}</div>
     </div>
     <div class="card p-4"><h2 class="font-semibold mb-1">Tần suất theo thứ trong tuần</h2><p class="text-xs text-[#94A3B8] mb-2">Số lần hoàn thành năm ${vy}</p><div class="h-44"><canvas id="wk"></canvas></div></div>
    </div>
   </section>
   <section class="card p-4">
    <div class="flex items-center justify-between mb-3 flex-wrap gap-2"><h2 class="font-semibold">Tổng quan năm ${vy} <span class="text-sm font-normal text-[#94A3B8] ml-1">${yTotal} ngày hoàn thành</span></h2>
     <div class="flex items-center gap-1.5"><button data-a="yprev" class="btn" aria-label="Năm trước">${ico.l}</button><button data-a="ynext" class="btn" aria-label="Năm sau">${ico.r}</button></div></div>
    <div class="overflow-x-auto pb-1"><div style="min-width:640px">
     <div class="grid gap-[3px] mb-1" style="grid-template-columns:repeat(${weeks},minmax(10px,1fr))">${lab}</div>
     <div class="grid gap-[3px]" style="grid-template-rows:repeat(7,auto);grid-auto-flow:column;grid-template-columns:repeat(${weeks},minmax(10px,1fr))">${hm}</div>
    </div></div>
    <div class="flex items-center gap-1.5 justify-end mt-3 text-xs text-[#94A3B8]">Ít<span class="hc w-3 h-3"></span>${[1,2,3].map(n=>`<span class="hc w-3 h-3" style="${mix(t.color,n)}"></span>`).join('')}Nhiều</div>
   </section>
  </main>
 </div>`;
 last='';
 if(chart)chart.destroy();
 const mx=Math.max(...freq),cv=document.getElementById('wk');
 if(window.Chart&&cv){
  Chart.defaults.color='#94A3B8';Chart.defaults.font.family='Inter,system-ui,sans-serif';
  chart=new Chart(cv,{type:'bar',data:{labels:WD,datasets:[{data:freq,borderRadius:6,backgroundColor:freq.map(v=>v&&v===mx?'#F59E0B':'#3B82F6')}]},
   options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0},grid:{color:'#334155'}},x:{grid:{display:false}}}}});
 }
}

function toggle(k){
 const L=S.logs[S.sel];
 L[k]=(L[k]===S.lv)?0:S.lv;
 if(!L[k])delete L[k];
 last=k;
}
document.getElementById('app').addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');if(!b)return;
 const a=b.dataset.a;
 if(a!=='del')arm='';
 if(a==='day')toggle(b.dataset.d);
 else if(a==='prev')vm=new Date(vm.getFullYear(),vm.getMonth()-1,1);
 else if(a==='next')vm=new Date(vm.getFullYear(),vm.getMonth()+1,1);
 else if(a==='yprev')vy--;
 else if(a==='ynext')vy++;
 else if(a==='today'){vm=new Date(now.getFullYear(),now.getMonth(),1);vy=now.getFullYear()}
 else if(a==='task')S.sel=b.dataset.id;
 else if(a==='lv')S.lv=+b.dataset.n;
 else if(a==='del'){
  if(arm===b.dataset.id){S.tasks=S.tasks.filter(x=>x.id!==arm);delete S.logs[arm];if(S.sel===arm)S.sel=S.tasks[0].id;arm=''}
  else arm=b.dataset.id;
 }
 else if(a==='add'){
  const v=document.getElementById('nt').value.trim();if(!v)return;
  const id='t'+Date.now();
  S.tasks.push({id,name:v,color:COLORS[S.tasks.length%COLORS.length]});S.sel=id;
 }
 else if(a==='seed'){
  const L=S.logs[S.sel]=S.logs[S.sel]||{};
  for(let i=0;i<150;i++){const d=new Date(now);d.setDate(d.getDate()-i);if(Math.random()<.62)L[K(d)]=1+Math.floor(Math.random()*3)}
 }
 save();render();
});
document.getElementById('app').addEventListener('keydown',e=>{
 if(e.key==='Enter'&&e.target.id==='nt')document.querySelector('[data-a="add"]').click();
});
render();
</script>
</body>
</html>
